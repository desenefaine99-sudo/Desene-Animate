<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeseneAnimate+ Player</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

.player-container {
    width: 100%;
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 15px;
}

.title {
    font-size: 21px;
    margin-bottom: 15px;
    font-weight: bold;
}

.video-box {
    position: relative;
    width: 100%;
    background: #000;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border-radius: 12px;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

.controls {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    padding: 35px 15px 12px;
    background: linear-gradient(transparent, rgba(0,0,0,.95));
    opacity: 1;
}

.progress {
    width: 100%;
    height: 5px;
    accent-color: #e50914;
    cursor: pointer;
    margin: 0 0 12px;
}

.control-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}

button, select {
    background: transparent;
    color: white;
    border: none;
    cursor: pointer;
    font-size: 15px;
}

button:hover, select:hover {
    color: #e50914;
}

.play-button {
    font-size: 23px;
}

.time {
    font-size: 13px;
    color: #ddd;
}

.spacer {
    flex: 1;
}

select {
    background: #171717;
    padding: 7px;
    border-radius: 5px;
}

select option {
    background: #171717;
}

.volume {
    width: 75px;
    accent-color: #e50914;
    cursor: pointer;
}

.message {
    text-align: center;
    color: #aaa;
    margin-top: 15px;
    font-size: 14px;
}

.video-box:fullscreen {
    width: 100%;
    height: 100%;
    border-radius: 0;
}

.video-box:fullscreen video {
    object-fit: contain;
}

@media (max-width: 550px) {
    .player-container {
        margin-top: 15px;
        padding: 0 8px;
    }

    .control-row {
        gap: 8px;
    }

    .volume {
        width: 55px;
    }

    button, select {
        font-size: 13px;
    }

    .time {
        font-size: 11px;
    }
}
</style>
</head>

<body>

<div class="player-container">

    <div class="title" id="videoTitle">DeseneAnimate+ Player</div>

    <div class="video-box" id="videoBox">

        <video id="video" playsinline preload="metadata"></video>

        <div class="controls">

            <input
                type="range"
                class="progress"
                id="progress"
                min="0"
                max="100"
                value="0"
            >

            <div class="control-row">

                <button class="play-button" id="playBtn">▶</button>

                <button id="backBtn">↺ 10</button>
                <button id="forwardBtn">10 ↻</button>

                <span class="time" id="time">00:00 / 00:00</span>

                <div class="spacer"></div>

                <input
                    type="range"
                    class="volume"
                    id="volume"
                    min="0"
                    max="1"
                    step="0.05"
                    value="1"
                >

                <select id="speed">
                    <option value="0.25">0.25x</option>
                    <option value="0.5">0.5x</option>
                    <option value="0.75">0.75x</option>
                    <option value="1" selected>1x</option>
                    <option value="1.25">1.25x</option>
                    <option value="1.5">1.5x</option>
                    <option value="1.75">1.75x</option>
                    <option value="2">2x</option>
                </select>

                <button id="fullscreenBtn">⛶</button>

            </div>
        </div>
    </div>

    <div class="message" id="message">
        Player DeseneAnimate+
    </div>

</div>

<script>
const video = document.getElementById("video");
const videoBox = document.getElementById("videoBox");
const playBtn = document.getElementById("playBtn");
const progress = document.getElementById("progress");
const time = document.getElementById("time");
const volume = document.getElementById("volume");
const speed = document.getElementById("speed");
const message = document.getElementById("message");

const params = new URLSearchParams(window.location.search);
const videoURL = params.get("video");
const title = params.get("title");

if (title) {
    document.getElementById("videoTitle").textContent = title;
}

if (videoURL) {
    video.src = videoURL;
    video.load();
} else {
    message.textContent = "Nu a fost adăugat niciun videoclip.";
}

function formatTime(seconds) {
    if (!Number.isFinite(seconds)) return "00:00";

    const minutes = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);

    return String(minutes).padStart(2, "0") + ":" +
           String(secs).padStart(2, "0");
}

playBtn.addEventListener("click", () => {
    if (video.paused) {
        video.play().catch(() => {
            message.textContent = "Videoclipul nu poate fi pornit.";
        });
    } else {
        video.pause();
    }
});

video.addEventListener("play", () => {
    playBtn.textContent = "⏸";
    message.textContent = "";
});

video.addEventListener("pause", () => {
    playBtn.textContent = "▶";
});

video.addEventListener("timeupdate", () => {
    if (video.duration) {
        progress.value = (video.currentTime / video.duration) * 100;
        time.textContent =
            formatTime(video.currentTime) + " / " +
            formatTime(video.duration);
    }
});

video.addEventListener("loadedmetadata", () => {
    time.textContent =
        "00:00 / " + formatTime(video.duration);
    message.textContent = "";
});

video.addEventListener("error", () => {
    message.textContent =
        "Videoclipul nu a putut fi încărcat. Sursa poate fi indisponibilă.";
});

progress.addEventListener("input", () => {
    if (video.duration) {
        video.currentTime = (progress.value / 100) * video.duration;
    }
});

document.getElementById("backBtn").addEventListener("click", () => {
    video.currentTime = Math.max(0, video.currentTime - 10);
});

document.getElementById("forwardBtn").addEventListener("click", () => {
    if (video.duration) {
        video.currentTime = Math.min(
            video.duration,
            video.currentTime + 10
        );
    }
});

volume.addEventListener("input", () => {
    video.volume = volume.value;
    video.muted = Number(volume.value) === 0;
});

speed.addEventListener("change", () => {
    video.playbackRate = Number(speed.value);
});

document.getElementById("fullscreenBtn").addEventListener("click", () => {
    if (!document.fullscreenElement) {
        videoBox.requestFullscreen?.();
    } else {
        document.exitFullscreen?.();
    }
});
</script>

</body>
</html>
