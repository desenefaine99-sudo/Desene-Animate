<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DeseneAnimate Cinema</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #100b19;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    background: #1c102b;
    padding: 22px;
    text-align: center;
    border-bottom: 2px solid #7838b8;
}

.logo {
    color: #d9aaff;
    font-size: 30px;
    font-weight: bold;
}

nav {
    margin-top: 15px;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 0 12px;
}

.hero {
    text-align: center;
    padding: 55px 15px;
    background: linear-gradient(135deg, #28113d, #100b19);
}

.hero h1 {
    color: #d9aaff;
    font-size: 36px;
}

.hero p {
    color: #ccc;
}

.movies {
    max-width: 1100px;
    margin: 35px auto;
    padding: 15px;
}

.movies h2 {
    color: #d9aaff;
    margin-bottom: 25px;
}

.movie-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 200px));
    gap: 25px;
}

.movie-card {
    background: #21152f;
    border-radius: 12px;
    overflow: hidden;
    text-decoration: none;
    color: white;
    transition: 0.3s;
}

.movie-card:hover {
    transform: translateY(-7px);
    box-shadow: 0 8px 25px #7838b855;
}

.movie-card img {
    width: 100%;
    height: 280px;
    object-fit: cover;
    display: block;
}

.movie-card h3 {
    text-align: center;
    padding: 12px 8px;
    margin: 0;
    font-size: 17px;
}

footer {
    background: #1c102b;
    text-align: center;
    padding: 25px;
    color: #aaa;
    margin-top: 50px;
}
</style>
</head>

<body>

<header>
    <div class="logo">DeseneAnimate</div>

    <nav>
        <a href="index.html">Acasă</a>
        <a href="#filme">Filme</a>
        <a href="https://discord.com/">Discord</a>
    </nav>
</header>

<section class="hero">
    <h1>Bine ai venit la DeseneAnimate Cinema!</h1>
    <p>Alege filmul preferat și începe aventura!</p>
</section>

<section class="movies" id="filme">

    <h2>Filme disponibile</h2>

    <div class="movie-grid">
        
    <a href="hotel1.html" class="movie-card">
    <img src="postere/hotel1.jpg"
         alt="Poster Hotel Transylvania 2012">
    <h3>Hotel Transylvania (2012)</h3>
</a>

        <a href="hotel.html" class="movie-card">
            <img src="postere/hotel.jpg"
                 alt="Poster Hotel Transylvania 4">
            <h3>Hotel Transylvania 4</h3>
        </a>

        <a href="scooby.html" class="movie-card">
            <img src="postere/scooby.jpg"
                 alt="Poster Scooby-Doo pe Insula Zombie">
            <h3>Scooby-Doo pe Insula Zombie</h3>
        </a>

    </div>

</section>

<footer>
    DeseneAnimate Cinema
</footer>

</body>
</html>
