<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The New Movies Scooby-Doo - Episodul 1</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
 background:#101010;color:white;
 font-family:Arial,sans-serif;
}
header{
 background:#080808;padding:20px 6%;
 display:flex;justify-content:space-between;align-items:center;
}
.logo{color:#e50914;font-size:24px;font-weight:bold}
header a{color:white;text-decoration:none}
main{max-width:1200px;margin:auto;padding:35px 5%}
h1{font-size:30px;margin-bottom:12px}
.info{color:#aaa;margin-bottom:25px}
.player{
 width:100%;aspect-ratio:16/9;
 background:#000;border-radius:12px;
 overflow:hidden;box-shadow:0 5px 25px #0009;
 animation:appear .8s ease;
}
.player iframe{width:100%;height:100%;border:0}
.description{
 margin-top:30px;background:#1b1b1b;
 padding:22px;border-radius:10px;
 line-height:1.7;color:#ccc;
 animation:appear 1s ease;
}
.buttons{display:flex;gap:12px;margin-top:25px;flex-wrap:wrap}
.btn{
 padding:12px 20px;border-radius:6px;
 background:#e50914;color:white;
 text-decoration:none;font-weight:bold;
 transition:.3s;
}
.btn:hover{background:#b20710;transform:scale(1.04)}
footer{
 text-align:center;padding:30px;color:#777;
 margin-top:40px;background:#080808;
}
@keyframes appear{
 from{opacity:0;transform:translateY(20px)}
 to{opacity:1;transform:translateY(0)}
}
@media(prefers-reduced-motion:reduce){
 *{animation:none!important;transition:none!important}
}
</style>
</head>

<body>

<header>
 <div class="logo">DeseneAnimate+</div>
 <a href="index.html">Înapoi la serial</a>
</header>

<main>
 <h1>The New Movies Scooby-Doo – Episodul 1</h1>
 <p class="info">Sezonul 1 • Episodul 1</p>

 <div class="player">
  <iframe
   src="https://filmedublate.net/embed/filmsrv.php?search=noile-filme-cu-scooby-doo-s01e01"
   allowfullscreen>
  </iframe>
 </div>

 <div class="description">
  <h2>Despre episod</h2>
  <p>
   Scooby-Doo și prietenii săi se intalnesc cu cei 3 natangi
  </p>
 </div>

 <div class="buttons">
  <a href="index.html" class="btn">◀ Înapoi la episoade</a>
 </div>
</main>

<footer>
 © 2026 DeseneAnimate+
</footer>

</body>
</html>
